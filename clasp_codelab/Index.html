                var lbl = { all: 'Semua status', baru: 'Pendaftar baru', 'belum-followup': 'Belum di-follow up', 'berkas-kurang': 'Berkas belum lengkap', 'dijadwalkan': 'Sudah dijadwalkan' }[s] || s;
                return '<option value="' + esc(s) + '"' + (STATE.filter.status === s ? ' selected' : '') + '>' + esc(lbl) + '</option>';
              }).join('') + '</select>' +
              '<select id="fMinat"><option value="">Semua bidang</option>' + Object.keys(minat).sort().map(function (m) {
                return '<option value="' + esc(m) + '"' + (STATE.filter.minat === m ? ' selected' : '') + '>' + esc(potong(m, 28)) + '</option>';
              }).join('') + '</select>' +
              '<input type="date" id="fDari" value="' + esc(STATE.filter.dari) + '" title="Dari tanggal">' +
              '<input type="date" id="fSampai" value="' + esc(STATE.filter.sampai) + '" title="Sampai tanggal">' +
              '<select id="fSort">' + [['terbaru', 'Urut: terbaru daftar'], ['terlama', 'Urut: terlama daftar'], ['nama', 'Urut: nama A-Z']].map(function (o) {
                return '<option value="' + o[0] + '"' + (STATE.sort === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
              }).join('') + '</select>' +
              '<select id="fUkuran">' + [12, 25, 50].map(function (n) {
                return '<option value="' + n + '"' + (STATE.perHalaman === n ? ' selected' : '') + '>' + n + ' baris per halaman</option>';
              }).join('') + '</select>' +
            '</div>' +
            petunjukTab() +
            '<div id="tabelDaftar"></div>' +
          '</div>';

        el('cari').addEventListener('input', function () { STATE.filter.kata = this.value.trim(); STATE.halaman = 1; renderTabelDaftar(); });
        el('fStatus').addEventListener('change', function () { STATE.filter.status = this.value; STATE.halaman = 1; renderTabelDaftar(); });
        el('fMinat').addEventListener('change', function () { STATE.filter.minat = this.value; STATE.halaman = 1; renderTabelDaftar(); });
        el('fDari').addEventListener('change', function () { STATE.filter.dari = this.value; STATE.halaman = 1; renderTabelDaftar(); });
        el('fSampai').addEventListener('change', function () { STATE.filter.sampai = this.value; STATE.halaman = 1; renderTabelDaftar(); });
        el('fSort').addEventListener('change', function () { STATE.sort = this.value; STATE.halaman = 1; renderTabelDaftar(); });
        el('fUkuran').addEventListener('change', function () { STATE.perHalaman = Number(this.value); STATE.halaman = 1; renderTabelDaftar(); });
        if (el('btnArsip')) el('btnArsip').addEventListener('click', function () {
          var b = el('btnArsip');
          if (b.disabled) return;
          b.disabled = true;
          var mau = !STATE.rowsArsip;
          run('setelArsip', [STATE.brand, mau]).then(function () {
            STATE.rowsArsip = mau;
            pesan(mau ? 'Ditandai arsip — pendaftarnya tidak dihitung sebagai "baru" lagi.' : 'Status arsip dilepas, dihitung lagi.');
            lupaRows();
            return init();
          }).catch(function (e) { b.disabled = false; pesan(e, true); });
        });
        renderTabelDaftar();
      }).catch(galatHalaman);
    }

    function saringRows() {
      var f = STATE.filter;
      var kata = f.kata.toLowerCase();
      var rows = rowsLingkup().filter(function (r) {
        if (f.status === 'baru' && !r.baru) return false;
        if (f.status === 'belum-followup' && !belumDifollow(r)) return false;
        if (f.status === 'berkas-kurang' && !berkasKurang(r)) return false;
        if (f.status === 'dijadwalkan' && !sudahJadwalAktif(r)) return false;
        if (['all', 'baru', 'belum-followup', 'berkas-kurang', 'dijadwalkan'].indexOf(f.status) === -1 && r.status !== f.status) return false;
        if (f.minat && r.minat !== f.minat) return false;
        if (f.dari && r.iso && r.iso.slice(0, 10) < f.dari) return false;
        if (f.sampai && r.iso && r.iso.slice(0, 10) > f.sampai) return false;
        if (!kata) return true;
        return (r.nama + ' ' + r.email + ' ' + r.minat + ' ' + r.kampus + ' ' + r.prodi + ' ' + r.hp).toLowerCase().indexOf(kata) !== -1;
      });
      if (STATE.sort === 'nama') rows = rows.slice().sort(function (a, b) { return a.nama.localeCompare(b.nama); });
      else if (STATE.sort === 'terlama') rows = rows.slice().sort(function (a, b) { return (a.iso || '') < (b.iso || '') ? -1 : 1; });
      else rows = rows.slice().sort(function (a, b) { return (a.iso || '') > (b.iso || '') ? -1 : 1; });
      return rows;
    }

    function renderTabelDaftar() {
      var rows = saringRows();
      var totalHalaman = Math.max(Math.ceil(rows.length / STATE.perHalaman), 1);
      if (STATE.halaman > totalHalaman) STATE.halaman = totalHalaman;
      var mulai = (STATE.halaman - 1) * STATE.perHalaman;
      const tampil = rows.slice(mulai, mulai + STATE.perHalaman);

      el('tabelDaftar').innerHTML =
        '<div style="overflow-x:auto"><table><thead><tr>' +
        '<th>Tanggal daftar</th>' + (semuaTersedia() ? '<th>Brand</th>' : '') + '<th>Pendaftar</th><th class="sembil">Bidang</th><th class="sembil">Asal kampus</th>' +
        '<th>Status</th><th class="sembil">Berkas</th><th class="sembil">Follow-up</th><th></th>' +
        '</tr></thead><tbody>' +
        tampil.map(function (r) {
          return '<tr data-row="' + r.row + '" data-brand="' + esc(r.brand) + '"' + (STATE.detail && STATE.detail.row === r.row ? ' class="selected"' : '') + '>' +
            '<td>' + esc(r.timestamp) + (r.baru ? '<span class="tag-baru">baru</span>' : '') + '</td>' +
            (semuaTersedia() ? '<td>' + esc(r.brand) + '</td>' : '') +
            '<td><div class="nama">' + esc(r.nama) + '</div><div class="sub">' + esc(r.email) + '</div><div class="sub">' + esc(r.hp) + '</div></td>' +
            '<td class="sembil">' + esc(potong(r.minat, 26) || '-') + '</td>' +
            '<td class="sembil">' + esc(potong(r.kampus, 26) || '-') + '<div class="sub">' + esc(potong(r.prodi, 24)) + '</div></td>' +
            '<td>' + pilStatus(r.status) + '</td>' +
            '<td class="sembil">' + (r.berkas.total ? r.berkas.ada + ' / ' + r.berkas.total : '-') +
            (r.dokumenDiperiksa ? '<div class="sub">' + esc(r.dokumenDiperiksa) + '</div>' : '') + '</td>' +
            '<td class="sembil">' + (r.jumlahFollowUp ? r.jumlahFollowUp + ' catatan' : 'belum') +
            (r.jadwal ? '<div class="sub">' + esc(potong(r.jadwal, 22)) + '</div>' : '') + '</td>' +
            '<td><button class="btn ghost kecil" type="button">Detail</button></td></tr>';
        }).join('') +
        '</tbody></table></div>' +
        (rows.length ? '' : '<div class="kosong">' + (rowsLingkup().length
          ? 'Tidak ada pendaftar yang cocok dengan filter ini.'
          : 'Belum ada pendaftar yang cocok. Sheet-nya kosong — isi form-nya sekali supaya ada barisnya.') + '</div>') +
        '<div class="paginasi"><span>' + rows.length + ' data &middot; halaman ' + STATE.halaman + ' dari ' + totalHalaman + '</span>' +
        '<button class="btn subtle kecil" type="button" id="prev"' + (STATE.halaman === 1 ? ' disabled' : '') + '>Sebelumnya</button>' +
        '<button class="btn subtle kecil" type="button" id="next"' + (STATE.halaman === totalHalaman ? ' disabled' : '') + '>Berikutnya</button></div>';

      Array.prototype.forEach.call(el('tabelDaftar').querySelectorAll('tbody tr'), function (tr) {
        tr.querySelector('button').addEventListener('click', function () {
          bukaDetail(Number(tr.getAttribute('data-row')), tr.getAttribute('data-brand'));
        });
      });
      el('prev').addEventListener('click', function () { STATE.halaman--; renderTabelDaftar(); });
      el('next').addEventListener('click', function () { STATE.halaman++; renderTabelDaftar(); });
    }

    // ---------- 3. Seleksi ----------
    function tampilSeleksi() {
      var seq = STATE.renderSeq;
      return pastikanRows().then(function () {
        if (seq !== STATE.renderSeq) return;
        var arti = {
          Seleksi: 'baru daftar, belum diputuskan',
          Diterima: 'lolos seleksi, magangnya berjalan',
          Lulus: 'selesai magang, siap dikirimi sertifikat',
          Ditolak: 'gugur di tahap seleksi',
          Dikeluarkan: 'berhenti sebelum selesai magang',
        };
        var kolom = (STATE.bootstrap.statusList || []).map(function (st) {
          return { judul: st, tahap: [st], ket: arti[st] || '' };
        });
        el('halaman').innerHTML = '<div class="hint" style="margin-bottom:8px">Tarik kartunya ke kolom lain untuk memindahkan status — langsung tersimpan, tidak perlu refresh.</div>' +
          '<div class="kolom-status" style="grid-template-columns:repeat(' + kolom.length + ',minmax(180px,1fr))">' + kolom.map(function (s) {
          var isi = rowsLingkup().filter(function (r) { return s.tahap.indexOf(r.status) !== -1; });
          return '<div data-status="' + esc(s.judul) + '"' + (isi.length ? '' : ' class="kosongKolom"') + '><div class="kepala"><strong>' + esc(s.judul) + '</strong><span class="count">' + isi.length + '</span></div><div class="sub">' + esc(s.ket) + '</div>' +
            (isi.length ? isi.map(function (r) {
              var perluWawancara = s.judul === 'Seleksi' || s.judul === 'Ditolak';
              return '<div class="kartu" draggable="true" data-row="' + r.row + '" data-brand="' + esc(r.brand) + '"><div class="nm">' + esc(r.nama) + '</div>' +
                '<div class="sub">' + esc(potong(r.minat, 34) || '-') + '</div>' +
                '<div class="sub">' + esc(r.timestamp) + '</div>' +
                (perluWawancara
                  ? '<div class="sub" style="margin-top:6px">' + (r.jadwal
                      ? '<span class="pill hijau">sudah wawancara</span> <span class="sub">' + esc(potong(r.jadwal, 24)) + '</span>'
                      : '<span class="pill merah">belum wawancara</span>') + '</div>'
                  : '') +
                '<div class="sub" style="margin-top:4px">' + (r.jumlahFollowUp ? r.jumlahFollowUp + ' catatan follow-up' : 'belum di-follow up') + '</div></div>';
            }).join('') : '<div class="kosong">Belum ada yang di tahap ini.</div>') + '</div>';
        }).join('') + '</div>';

      Array.prototype.forEach.call(el('halaman').querySelectorAll('.kartu'), function (c) {
        c.addEventListener('click', function () {
          if (Date.now() - STATE.seretAkhir < 300) return;
          bukaDetail(Number(c.getAttribute('data-row')), c.getAttribute('data-brand'));
        });
        c.addEventListener('dragstart', function (ev) {
          STATE.yangDiseret = { row: Number(c.getAttribute('data-row')), brand: c.getAttribute('data-brand') };
          c.classList.add('seret');
          try { ev.dataTransfer.setData('text/plain', c.getAttribute('data-row')); } catch (e) { /* IE/iframe lama */ }
          ev.dataTransfer.effectAllowed = 'move';
        });
        c.addEventListener('dragend', function () {
          c.classList.remove('seret');
          STATE.seretAkhir = Date.now();
        });
      });
      Array.prototype.forEach.call(el('halaman').querySelectorAll('[data-status]'), function (kol) {
        kol.addEventListener('dragover', function (ev) {
          ev.preventDefault();
          ev.dataTransfer.dropEffect = 'move';
          kol.classList.add('sasar');
        });
        kol.addEventListener('dragleave', function () { kol.classList.remove('sasar'); });
        kol.addEventListener('drop', function (ev) {
          ev.preventDefault();
          kol.classList.remove('sasar');
          var yang = STATE.yangDiseret;
          STATE.seretAkhir = Date.now();
          STATE.yangDiseret = null;
          if (!yang) return;
          letakkanKolom(yang.row, yang.brand, kol.getAttribute('data-status'));
        });
      });
      }).catch(galatHalaman);
    }

    // Tarik-lepas di papan: papan berubah duluan, server menyusul, balik lagi kalau server menolak.
    function letakkanKolom(rowNum, merek, tujuan) {
      var punya = STATE.rowsByBrand[merek];
      var baris = punya ? (punya.rows || []).filter(function (r) { return r.row === rowNum; })[0] : null;
      if (!baris || baris.status === tujuan) { tampilSeleksi(); return; }
      var lanjut = function () {
        var lama = baris.status;
        var diDaftar = STATE.rows.filter(function (r) { return r.row === rowNum && r.brand === merek; })[0];
        baris.status = tujuan;
        if (diDaftar) diDaftar.status = tujuan;
        if (STATE.detail && STATE.detail.row === rowNum && STATE.detail.brand === merek) STATE.detail.status = tujuan;
        tampilSeleksi();
        run('updateStatus', [merek, rowNum, tujuan]).then(function (res) {
          if (STATE.detail && STATE.detail.row === rowNum) {
            STATE.detail.riwayat = (STATE.detail.riwayat || []).concat([res.waktu + ' - Status: ' + lama + ' -> ' + tujuan]);
            renderPanel();
          }
          pesan(baris.nama + ' sekarang ' + tujuan);
          segarkan(merek).catch(function () {});
          return null;
        }).catch(function (e) {
          baris.status = lama;
          if (diDaftar) diDaftar.status = lama;
          pesan(e, true);
          tampilSeleksi();
        });
      };
      if (tujuan === 'Ditolak' || tujuan === 'Dikeluarkan') {
        mintaKonfirmasi('Pindahkan ke ' + tujuan + '?', baris.nama + ' akan menjadi ' + tujuan + ' dan tercatat di riwayat.', 'Ya, pindahkan', lanjut);
      } else lanjut();
    }

    // ---------- 4. Laporan ----------
    function tampilLaporan() {
      // Kotak tanggal + tombol "Semua periode" dihapus atas permintaan admin: laporan selalu menghitung semua data.
      el('halaman').innerHTML = '<div class="card"><div id="isiLaporan">Memuat...</div></div>';
      var p = STATE.prefetch;
      STATE.prefetch = null;
      var l = p ? (STATE.lingkup === 'semua' ? p.laporanSemua : p.laporan) : null;
      if (!l && STATE.laporanCache) {
        l = STATE.lingkup === 'semua' ? STATE.laporanCache.semua : STATE.laporanCache.perBrand[STATE.brand];
      }
      if (l) { renderLaporan(l); return Promise.resolve(); }
      return muatLaporan();
    }

    function muatLaporan() {
      var merek = STATE.lingkup === 'semua' ? null : STATE.brand;
      return run('getLaporan', [merek, '', ''])
        .then(function (l) {
          STATE.laporanCache = STATE.laporanCache || { semua: null, perBrand: {} };
          if (merek === null) STATE.laporanCache.semua = l;
          else STATE.laporanCache.perBrand[merek] = l;
          renderLaporan(l);
        })
        .catch(function (e) { el('isiLaporan').innerHTML = '<div class="kosong">' + esc(e) + '</div>'; });
    }

    // Daftar singkat di bawah tile Laporan. Laporan tidak lagi memakai batas tanggal,
    // jadi angkanya selalu seluruh data merek yang sedang dibuka.
    function tampilkanDiLaporan(judul, k) {
      var kotak = el('hasilLaporan');
      var rows = rowsLingkup().filter(function (r) {
        if (k === 'gugur') return r.status === 'Ditolak' || r.status === 'Dikeluarkan';
        if (k === 'all') return true;
        return r.status === k;
      });
      var shown = rows.slice(0, 12);
      kotak.innerHTML =
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="kepala-sasaran"><h3>' + esc(judul) + ' <span class="count">' + rows.length + '</span></h3>' +
          '<span><button class="btn subtle kecil" type="button" data-tutup>Tutup</button></span></div>' +
          (rows.length
            ? '<div class="baris-list">' + shown.map(function (r) {
                return '<div class="isi bisa" data-row="' + r.row + '" data-brand="' + esc(r.brand || STATE.brand) + '"><div class="avatar">' + esc(inisial(r.nama)) + '</div>' +
                  '<div class="grow"><div class="nama">' + esc(r.nama) + (r.baru ? '<span class="tag-baru">baru</span>' : '') + '</div>' +
                  '<div class="sub">' + esc(potong(r.minat, 46) || '-') + ' &middot; ' + esc(r.timestamp) + '</div></div>' +
                  pilStatus(r.status) + '</div>';
              }).join('') +
              (rows.length > shown.length ? '<div class="hint" style="margin-top:8px">Menampilkan 12 dari ' + rows.length + ' orang.</div>' : '') +
              '</div>'
            : '<div class="kosong">Tidak ada yang cocok di merek ini.</div>') +
        '</div>';
      Array.prototype.forEach.call(kotak.querySelectorAll('[data-row]'), function (b) {
        b.addEventListener('click', function () { bukaDetail(Number(b.getAttribute('data-row')), b.getAttribute('data-brand')); });
      });
      kotak.querySelector('[data-tutup]').addEventListener('click', function () { kotak.innerHTML = ''; });
      kotak.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function renderLaporan(l) {
        STATE.laporan = l;
        var s = l.stats;
        el('isiLaporan').innerHTML =
          '<div class="sub" style="margin-bottom:12px">' + (l.lingkup === 'semua' ? 'Semua brand' : esc(l.lingkup)) + '</div>' +
          '<div class="grid tiles" style="margin-bottom:14px">' +
            '<button class="tile" type="button" data-lk="all"><div class="num">' + l.total + '</div><div class="lbl">Total pendaftar</div></button>' +
            '<button class="tile" type="button" data-lk="Diterima"><div class="num">' + (s.Diterima || 0) + '</div><div class="lbl">Diterima</div></button>' +
            '<button class="tile" type="button" data-lk="Lulus"><div class="num">' + (s.Lulus || 0) + '</div><div class="lbl">Lulus</div></button>' +
            '<button class="tile" type="button" data-lk="gugur"><div class="num">' + ((s.Ditolak || 0) + (s.Dikeluarkan || 0)) + '</div><div class="lbl">Ditolak / dikeluarkan</div></button>' +
            '<button class="tile" type="button" data-lk="sertifikat"><div class="num">' + l.sudahTerkirim + '</div><div class="lbl">Sertifikat terkirim</div></button>' +
          '</div>' +
          '<div id="hasilLaporan"></div>' +
          '<div class="card" id="kartuSertifikat"><h3>Pengiriman sertifikat</h3>' +
            '<div class="hint">Daftar ini peserta berstatus Lulus. "Unduh PDF" membuka file sertifikat di Drive; kalau tertulis "File hilang", filenya sudah dibuang dari Drive — kirim ulang saja.</div>' +
            (l.sertifikat.length
              ? '<div style="overflow-x:auto"><table class="rapat"><thead><tr><th>Penerima</th>' + (l.lingkup === 'semua' ? '<th>Brand</th>' : '') + '<th class="sembil">Bidang</th><th>Status</th><th class="sembil">Berkas</th><th></th></tr></thead><tbody>' +
                l.sertifikat.map(function (s) {
                  return '<tr><td><div class="nama">' + esc(s.nama) + '</div><div class="sub">' + esc(s.email) + '</div></td>' +
                    (l.lingkup === 'semua' ? '<td>' + esc(s.brand) + '</td>' : '') +
                    '<td class="sembil">' + esc(potong(s.minat, 26) || '-') + '</td>' +
                    '<td><span class="pill ' + (s.state === 'Terkirim' ? 'hijau' : 'merah') + '">' + esc(s.state) + '</span></td>' +
                    '<td class="sembil">' + (s.link
                      ? '<a href="' + esc(s.link) + '" target="_blank" rel="noopener" style="color:#4f46e5">Unduh PDF</a>'
                      : (s.state === 'File hilang' ? '<span class="sub">filenya sudah tidak ada di Drive</span>' : '<span class="sub">belum ada</span>')) + '</td>' +
                    '<td>' + (s.state === 'Terkirim' ? '' : '<button class="btn ghost kecil" type="button" data-kirim="' + esc(s.brand) + '|' + s.row + '">Kirim sekarang</button>') + '</td></tr>';
                }).join('') + '</tbody></table></div>'
              : '<div class="kosong">Belum ada peserta berstatus Lulus.</div>') +
          '</div>' +
          '<div class="grid dua" style="margin-top:14px">' +
            '<div class="card"><h3>Pendaftar per bulan</h3>' + kolomHtml(l.perBulan, true) + '</div>' +
            '<div class="card"><h3>Per bidang</h3>' + kolomHtml(l.perMinat, true) + '</div>' +
          '</div>' +
          '<div class="card" style="margin-top:14px"><h3>Asal kampus terbanyak</h3>' + (l.perKampus.length ? kolomHtml(l.perKampus, true) : '<div class="kosong">Belum ada datanya. Isi form-nya sekali supaya tab ini terisi.</div>') + '</div>';

        Array.prototype.forEach.call(el('isiLaporan').querySelectorAll('[data-kirim]'), function (b) {
          b.addEventListener('click', function () {
            // Daftar ini bisa berisi beberapa brand sekaligus, jadi brand-nya ikut dibawa di atributnya.
            var bagian = String(b.getAttribute('data-kirim')).split('|');
            kirimSertifikatBaris(Number(bagian[1]), bagian[0]);
          });
        });

        Array.prototype.forEach.call(el('isiLaporan').querySelectorAll('[data-lk]'), function (b) {
          b.addEventListener('click', function () {
            var judul = b.querySelector('.lbl').textContent.trim(), kunci = b.getAttribute('data-lk');
            if (kunci === 'sertifikat') {
              el('kartuSertifikat').scrollIntoView({ behavior: 'smooth', block: 'start' });
              return;
            }
            var merek = STATE.brand;
            // Kartu yang diklik terakhir yang boleh menulis hasil, supaya hasil klik sebelumnya
            // tidak datang terlambat dan menampilkan daftar milik kartu lain.
            STATE.laporanTerakhir = judul;
            pastikanRows().then(function () {
              if (!sedangLaporan() || STATE.brand !== merek || STATE.laporanTerakhir !== judul || !el('hasilLaporan')) return;
              tampilkanDiLaporan(judul, kunci);
            }).catch(galatHalaman);
          });
        });
    }

    // ---------- 5. Pengaturan ----------
    function tampilPengaturan() {
      el('halaman').innerHTML = '<div id="isiSetting">Memuat...</div>';
      var k = STATE.prefetch && STATE.prefetch.konfigurasi ? STATE.prefetch.konfigurasi : STATE.konfigurasi;
      STATE.prefetch = null;
      if (k) {
        // Layar digambar dari yang terakhir ada, servernya nyusul di belakang.
        renderSetting(k);
        // Jangan menimpa layar sambil admin mengisi form integrasi.
        if (!STATE.integrasiDraft) run('getKonfigurasi').then(renderSetting).catch(function (e) { /* yang di layar tetap boleh dibaca */ });
        return Promise.resolve();
      }
      return run('getKonfigurasi').then(renderSetting).catch(galatHalaman);
    }


    // ---------- Integrasi Spreadsheet (menu sendiri) ----------
    // Hasil "Cek Akses Tulis": menjawab kenapa data bisa dilihat tapi tidak bisa diubah.
    function tampilAkses(a) {
      var boleh = a.editor === true;
      var bagian = ['<div style="margin-top:8px"><strong>' + esc(a.nama || a.id) + '</strong> &middot; pemilik: ' + esc(a.pemilik || '?') +
        ' &middot; tingkat akses: ' + esc(a.akses || '?') + '</div>' +
        '<div style="margin-top:4px">Boleh diedit aplikasi: <strong style="color:' + (boleh ? '#047857' : '#b91c1c') + '">' +
        (a.editor === null ? 'tidak terdeteksi' : (boleh ? 'YA' : 'TIDAK')) + '</strong> &middot; aplikasi jalan sebagai: ' + esc(a.yangJalan || '?') + '</div>'];
      if (!boleh) {
        bagian.push('<div class="hint" style="margin-top:6px">Kalau datanya bisa dilihat tapi tidak bisa diubah, ini penyebabnya: ' +
          'buka file itu pakai akun pemiliknya → <strong>Bagikan</strong> → tambahkan <strong>' + esc(a.yangJalan || 'akun yang menjalankan') +
          '</strong> dengan peran <strong>Editor</strong>. Kalau daftarnya tidak mau menerima akun itu, admin Google-nya membatasi berbagi ke luar organisasi — ' +
          'jalur lain: salin tab datanya ke spreadsheet yang sudah dipakai aplikasi ini.</div>');
      }
      if (a.tab && a.tab.length) bagian.push('<div class="sub" style="margin-top:4px">Tab terbaca: ' + esc(a.tab.join(', ')) + '</div>');
      (a.catatan || []).forEach(function (c) { bagian.push('<div class="sub" style="color:#b91c1c">' + esc(c) + '</div>'); });
      return bagian.join('');
    }

    function integrasiKartuHtml(r, k) {

        '<div class="sambung' + (terhubung ? '' : ' gagal') + '"><span class="tit">' + esc(pesan) + '</span>' +
          (terhubung ? '<span class="pill hijau">Terhubung</span>' : '<span class="pill merah">' + esc(r['Status Koneksi']) + '</span>') + '</div>' +
        '<dl class="kv">' +
          barisKv('Brand', r.Brand) +
          barisKv('Program', r.Program || '-') +
          barisKv('URL Spreadsheet', r['URL Spreadsheet']) +
          barisKv('Spreadsheet ID', r['Spreadsheet ID']) +
          barisKv('Nama sheet respons', r['Nama Sheet'] || '(tab jawaban pertama)') +
          barisKv('URL Google Form', r['URL Google Form'] || '-') +
          (r['Form ID'] || r['URL Edit Form']
            ? '<dt>Edit Google Form</dt><dd><a href="' + esc(r['URL Edit Form'] || ('https://docs.google.com/forms/d/' + encodeURIComponent(r['Form ID']) + '/edit')) + '" target="_blank" rel="noopener">buka setelan form &middot; tab Tanggapan</a></dd>'
            : '<dt>Edit Google Form</dt><dd>Form ID belum tersimpan &mdash; tekan Sinkronkan atau Uji Koneksi dulu.</dd>') +
          barisKv('Link dashboard brand ini', k.urlDashboard ? k.urlDashboard + '?brand=' + encodeURIComponent(r.Brand || '') : '-') +
          barisKv('Status', r.Status + (r.dipakai ? ' · sudah dibaca dashboard' : ' · belum disinkronkan')) +
          barisKv('Terakhir diuji', r['Terakhir Diuji'] || '-') +
          barisKv('Terakhir berhasil terhubung', r['Terakhir Terhubung'] || '-') +
          (r.Deskripsi ? barisKv('Deskripsi', r.Deskripsi) : '') +
        '</dl>' +
        '<div class="lebar" style="margin-top:10px">' + tombol('data-i-kolom', 'Lihat Kolom') + ' ' + tombol('data-i-uji', 'Uji Koneksi') + ' ' +
          tombol('data-i-sinkron', 'Sinkronkan') + ' ' + tombol('data-i-edit', 'Edit Konfigurasi') + '</div>' +
          '<div class="lebar" style="margin-top:6px">' +
          ((r['Form ID'] || r['URL Google Form']) ? '<button class="btn subtle kecil" type="button" data-i-pindah="' + esc(r.ID) + '" title="Form-nya disetel ulang supaya jawaban barunya masuk ke tab sendiri di spreadsheet dashboard">Pindahkan jawaban form</button> ' : '') +
          '<button class="btn subtle kecil" type="button" data-i-status="' + esc(r.ID) + '|' + (r.Status === 'Aktif' ? 'Nonaktif' : 'Aktif') + '">' +
          (r.Status === 'Aktif' ? 'Nonaktifkan' : 'Aktifkan') + '</button> ' +
          '<button class="btn subtle kecil" type="button" data-i-akses="' + esc(r.ID) + '" title="Menanya ke Drive: akun yang menjalankan aplikasi ini boleh mengedit file itu tidak? Tidak menulis apa pun.">Cek Akses Tulis</button> ' +
          '<button class="btn subtle kecil" type="button" data-i-hapus="' + esc(r.ID) + '" title="Hapus konfigurasi ini dari daftar sumber">Hapus</button></div>' +
          '<div class="sub" id="akses-' + esc(r.ID) + '"></div></div>';
    }

    var labelSheet = function (s, dipilih, catatan) {
      return esc(s.nama) + ' — ' + s.baris + ' baris' + (catatan ? ' · ' + catatan : '') + (s.nama === dipilih ? ' ✔ dipilih' : '');
    };

    // Konfigurasi lain yang sudah membaca tab bernama ini di spreadsheet yang sedang dipilih.
    function integrasiPemakaiTab(nama) {
      var idSs = STATE.integrasiSsId || '';
      var edit = STATE.integrasiEdit || '';
      return (STATE.integrasi || []).filter(function (r) {
        return r.ID !== edit && (!idSs || r['Spreadsheet ID'] === idSs) &&
          String(r['Nama Sheet'] || '') === String(nama);
      })[0] || null;
    }

    function integrasiOpsiSheet() {
      var daftar = STATE.integrasiSheets || [];
      var dipilih = (STATE.integrasiDraft && STATE.integrasiDraft.namaSheet) || '';
      var opsi = ['<option value="">' +
        (dipilih ? '(biarkan: tab jawaban form ini)' : '(otomatis: tab jawaban pertama)') + '</option>'];
      if (dipilih && !daftar.some(function (s) { return s.nama === dipilih; })) {
        opsi.push('<option value="' + esc(dipilih) + '" selected>' +
          labelSheet({ nama: dipilih, baris: '?' }, dipilih, 'dari form ini') + '</option>');
      }
      daftar.forEach(function (s) {
        var catatan = [];
        if (s.nama === STATE.integrasiSheetForm) catatan.push('tempat form ini menulis jawaban');
        var pemakai = integrasiPemakaiTab(s.nama);
        if (pemakai) catatan.push('sudah dipakai "' + pemakai['Nama Konfigurasi'] + '"');
        opsi.push('<option value="' + esc(s.nama) + '"' + (s.nama === dipilih ? ' selected' : '') + '>' +
          labelSheet(s, dipilih, catatan.join(' · ')) + '</option>');
      });
      return opsi.join('');
    }

    function refreshIsianSheet() {
      var kotak = el('iSheet');
      if (kotak) kotak.innerHTML = integrasiOpsiSheet();
      var pesan = el('statusIntegrasi');
      if (!pesan || !STATE.integrasiSheets) return;
      var bentrok = STATE.integrasiSheetForm && integrasiPemakaiTab(STATE.integrasiSheetForm);
      pesan.textContent = bentrok
        ? 'Tab jawaban form ini (' + STATE.integrasiSheetForm + ') sudah dipakai konfigurasi "' +
          bentrok['Nama Konfigurasi'] + '". Simpan saja lalu tekan "Pindahkan jawaban form" supaya form ini dapat tab sendiri, atau "Tetap buat" kalau memang mau baca tab yang sama.'
        : STATE.integrasiSheets.length + ' tab terbaca. Pilih tab tempat jawaban form ini masuk' +
          (STATE.integrasiEdit ? ' (tab yang sekarang dipakai konfigurasi ini sudah terpilih).' : '.');
    }

    function integrasiFormHtml() {
      var d = STATE.integrasiDraft || {};
      var nilai = function (k) { return esc(d[k] || ''); };
      return '<div class="card" id="formIntegrasi">' +
        '<h3>' + (STATE.integrasiEdit ? 'Edit konfigurasi' : 'Konfigurasi baru') + '</h3>' +
        '<div id="iGalat" style="display:none;margin:0 0 10px;padding:8px 10px;border-radius:6px;font-size:12.5px"></div>' +
        '<div class="jadwal">' +
          '<input class="lebar" id="iNama" placeholder="Nama konfigurasi, contoh: Form MagangJogja Oktober" value="' + nilai('nama') + '">' +
          '<input class="lebar" id="iBrand" placeholder="Brand, contoh: MagangJogja" value="' + nilai('brand') + '">' +
          '<input class="lebar" id="iProgram" placeholder="Nama program magang (opsional)" value="' + nilai('program') + '">' +
          '<input class="lebar" id="iForm" placeholder="Link Google Form — boleh cuma ini saja, spreadsheet + tab jawabannya dicari otomatis" value="' + nilai('urlForm') + '">' +
          '<input class="lebar" id="iEdit" placeholder="URL edit Google Form (kosongkan = diambil otomatis dari ID form)" value="' + nilai('urlEdit') + '">' +
          '<input class="lebar" id="iSs" placeholder="Link Google Spreadsheet respons (boleh dikosongkan kalau link form sudah diisi)" value="' + nilai('urlSpreadsheet') + '">' +
          '<select id="iSheet">' + integrasiOpsiSheet() + '</select>' +
          '<input class="lebar" id="iDesk" placeholder="Deskripsi (opsional)" value="' + nilai('deskripsi') + '">' +
          '<select id="iStatus"><option' + (d.status === 'Nonaktif' ? '' : ' selected') + '>Aktif</option><option' + (d.status === 'Nonaktif' ? ' selected' : '') + '>Nonaktif</option></select>' +
        '</div>' +
        '<div class="hint" style="margin-top:8px"><strong>Tab jawaban</strong> = bagian spreadsheet tempat Google Form menuliskan pendaftar baru. Kalau link form diisi, tab-nya ketahuan sendiri setelah tombol di bawah ditekan. Pilih tab yang masih kosong / belum dipakai konfigurasi lain.</div>' +
        '<div class="lebar"><button class="btn subtle kecil" type="button" id="iCariSheet">Ambil daftar sheet dari spreadsheet itu</button></div>' +
        '<div class="lebar" style="margin-top:8px"><button class="btn" type="button" id="iSimpan">' + (STATE.integrasiEdit ? 'Simpan perubahan &amp; uji lagi' : 'Simpan &amp; Hubungkan') + '</button>' +
          '<button class="btn subtle" type="button" id="iBatal" style="margin-left:8px">Batal</button>' +
          '<span class="sub" id="statusIntegrasi" style="margin-left:10px"></span></div></div>';
    }

    // Keterangan hasil "Ambil semua tab" — dibiarkan di layar sampai halaman dimuat ulang,
    // jadi admin sempat baca tab mana yang masuk dan mana yang dilewati.
    function tampilAmbilTab(h) {
      var masuk = h.masuk || [];
      var dilewati = h.dilewati || [];
      var gagal = h.gagal || [];
      if (!masuk.length && !dilewati.length && !gagal.length) return '';
      var pendaftar = masuk.reduce(function (a, m) { return a + (m.baris || 0); }, 0);
      var bagian = ['<div class="hint" style="margin-top:10px"><strong>' + masuk.length + ' brand masuk</strong>' +
        ' &middot; ' + pendaftar + ' pendaftar terbaca' +
        (dilewati.length ? ' &middot; ' + dilewati.length + ' tab dilewati' : '') +
        (gagal.length ? ' &middot; ' + gagal.length + ' gagal' : '') + '</div>'];
      if (masuk.length) bagian.push('<div class="sub" style="margin-top:6px">' + masuk.map(function (m) {
        return '<strong>' + esc(m.brand) + '</strong>' + (m.tab === m.brand ? '' : ' &mdash; tab ' + esc(m.tab)) +
          ' &middot; ' + m.baris + ' pendaftar';
      }).join('<br>') + '</div>');
      if (dilewati.length) bagian.push('<div class="sub" style="margin-top:6px">Dilewati:' +
        dilewati.map(function (d) { return '<br>' + esc(d.tab) + ' &mdash; ' + esc(d.alasan); }).join('') + '</div>');
      if (gagal.length) bagian.push('<div class="hint" style="margin-top:6px;color:#b91c1c">Gagal:' +
        gagal.map(function (g) { return '<br>' + esc(g); }).join('') + '</div>');
      return '<div style="margin-top:10px;border-top:1px solid #e7eaf2;padding-top:4px">' + bagian.join('') + '</div>';
    }

    function tampilIntegrasi() {
      el('halaman').innerHTML = '<div id="isiIntegrasi">Memuat...</div>';
      var k = (STATE.prefetch && STATE.prefetch.konfigurasi) || STATE.konfigurasi;
      STATE.prefetch = null;
      if (k) { STATE.konfigurasi = k; renderIntegrasi(); return Promise.resolve(); }
      return run('getKonfigurasi').then(function (h) { STATE.konfigurasi = h; renderIntegrasi(); }).catch(galatHalaman);
    }

    function renderIntegrasi() {
      var k = STATE.konfigurasi || { integrasi: [] };
      STATE.integrasi = k.integrasi || [];
      if (!el('isiIntegrasi')) return;
      el('isiIntegrasi').innerHTML =
        '<div class="card" style="margin-bottom:14px"><h3>Sumber data pendaftaran</h3>' +
          '<div class="hint">Daftar konfigurasi disimpan di tab <strong>Integrasi</strong> pada file "' + esc(k.fileKonfigurasi || 'log') + '" — beda file dari spreadsheet jawaban pendaftar. Menambah brand atau form baru tidak perlu mengubah kode.</div>' +
          '<div class="hint" style="margin-top:8px"><strong>Cara menghubungkan form asli</strong>:' +
          '<ol style="margin:6px 0 0 18px;padding:0">' +
          '<li>Buka <a href="https://forms.google.com" target="_blank" rel="noopener">forms.google.com</a> → buat form (kolom pertama <em>Timestamp</em> otomatis, lalu <em>Nama Lengkap</em>, <em>Email</em>, <em>No. HP</em>, <em>Asal Sekolah/Kampus</em>, <em>Program magang yang diminati</em>).</li>' +
          '<li>Form → <strong>Kirim</strong> → ikon rantai → salin linknya; jawaban form diarahkan ke spreadsheet yang dipakai dashboard (titik tiga → <strong>Pilih tujuan tanggapan</strong>). Kalau menunya tidak ketemu, lewati saja — nanti tekan <strong>Pindahkan jawaban form</strong> di kartunya.</li>' +
          '<li>Isi form itu 1x → klik <strong>"+ Tambah Konfigurasi Baru"</strong> di atas → <strong>tempel link form-nya saja</strong> (spreadsheet + tab jawabannya dicari otomatis) → Simpan &amp; Hubungkan. Brand baru langsung muncul di bilah kiri; tekan Sinkronkan kalau ada jawaban yang belum masuk.</li>' +
          '</ol></div>' +
          (k.peringatan ? '<div class="hint" style="margin-top:8px;color:#b91c1c">' + esc(k.peringatan) + ' Yang lain tetap ditampilkan seperti biasa.</div>' : '') +
          '<div class="lebar" style="margin-top:10px"><button class="btn" type="button" id="btnIntegrasiBaru">+ Tambah Konfigurasi Baru</button>' +
          '<button class="btn subtle" type="button" id="btnSinkronSemua" style="margin-left:8px">Sinkronkan semua</button>' +
          '<button class="btn subtle" type="button" id="btnDuplikat" style="margin-left:8px" title="Mencari konfigurasi yang brand + spreadsheet + tab jawabannya sama persis (hasil menekan Simpan berkali-kali) lalu membuang yang kembar, yang tertua tetap dipertahankan.">Bersihkan duplikat</button></div></div>' +
        '<div class="card" style="margin-bottom:14px"><h3>Ambil semua tab sekaligus</h3>' +
          '<div class="hint">Satu spreadsheet biasanya punya lebih dari satu tab jawaban. Tekan tombol di bawah, maka <strong>semua tab yang ada di spreadsheet itu ikut didaftarkan</strong> — tiap tab jadi satu brand dengan nama sama seperti nama tab-nya, dan langsung muncul di bilah kiri. Brand tidak perlu diketik satu-satu lagi.</div>' +
          '<div class="jadwal" style="margin-top:8px"><input class="lebar" id="iAutoSs" placeholder="Link spreadsheet (kosongkan = spreadsheet yang sudah terhubung diperiksa semua)">' +
            '<div class="lebar"><button class="btn" type="button" id="btnAmbilTab" title="Membaca semua tab di spreadsheet itu. Tab Integrasi, tab Log, tab tersembunyi dan tab kosong dilewati. Brand yang sudah ada tidak pernah diubah.">Ambil semua tab</button>' +
            '<span class="sub" id="statusAmbilTab" style="margin-left:10px"></span></div></div>' +
          '<div class="hint" style="margin-top:2px">Tab yang kolom <em>Nama</em> atau <em>Email</em>-nya tidak dikenali ikut dilewati, bukan dipaksa masuk — brand tanpa data cuma memenuhi bilah kiri. Alasannya tampil di sini setelah tombol ditekan.</div>' +
          (STATE.ambilTab ? tampilAmbilTab(STATE.ambilTab) : '') + '</div>' +
        (STATE.integrasi.length
          ? '<div class="tanda-bawah"><b>' + STATE.integrasi.length + ' konfigurasi</b>' +
              (STATE.integrasi.length > 2 ? '<span class="panah-bawah">&darr;</span><span>daftar ini bisa digulir sendiri — yang di bawah tidak membuat halaman memanjang</span>' : '') +
            '</div>' +
            '<div class="tumpuk-integrasi">' + STATE.integrasi.map(function (r) { return integrasiKartuHtml(r, k); }).join('') + '</div>'
          : '<div class="card"><div class="kosong">Belum ada integrasi tersimpan. Klik "+ Tambah Konfigurasi Baru" untuk menghubungkan form dan spreadsheet jawabannya.</div></div>') +
        '<div id="kolomIntegrasi"></div>' +
        '<div class="card" style="margin-top:14px"><h3>Rapikan sisa</h3>' +
          '<div class="hint">Tiap form baru yang ditautkan ke spreadsheet ini membuat tab jawaban baru, jadi tab lama menumpuk. <strong>Buang form-nya dulu, baru tab-nya</strong> — Google tidak mengizinkan tab jawaban dihapus selama masih ada form yang menautkan diri. Tab hanya dihapus kalau benar-benar kosong; form masuk Trash Drive (masih bisa dipulihkan 30 hari).</div>' +
          '<div class="lebar" style="margin-top:10px"><button class="btn subtle" type="button" id="btnCekSisa">Cek sisa</button>' +
          '<button class="btn subtle" type="button" id="btnBersihContoh" style="margin-left:8px" title="Membuang brand contoh (MagangJogja, FreelanceJogja, SkillUp Jogja): barisnya, tab jawabannya, form CONTOH-nya ke Trash, kartunya di Integrasi, dan brandnya dari sidebar. Brand kantor tidak disentuh.">Bersihkan data contoh</button>' +
          '<span class="sub" id="statusSisa" style="margin-left:10px"></span></div>' +
          '<div class="hint" style="margin-top:8px">Sudah tidak butuh brand contoh lagi? Tekan <strong>Bersihkan data contoh</strong> — pendaftar asli dari kantor tidak ikut terhapus, dan brand contoh yang di tab-nya masih ada jawaban asli malah ditolak.</div>' +
          '<div id="isiSisa"></div></div>';
      bukaTutupDialog();
      pasangIntegrasi();
    }

    // Form tambah/edit konfigurasi muncul sebagai popup, bukan kartu di tengah halaman.
    // Form baru dibuka = kosong; form lama dibuka = ikut isian aslinya. Jangan dipanen dari layar.
    function simpanDraftDariLayar() {
      if (STATE.integrasiDraftKunci) { STATE.integrasiDraftKunci = false; return; }
      if (!STATE.integrasiDraft || !el('iNama')) return;
      STATE.integrasiDraft = {
        nama: el('iNama').value, brand: el('iBrand').value, program: el('iProgram').value,
        urlForm: el('iForm').value, urlEdit: el('iEdit').value, urlSpreadsheet: el('iSs').value,
        namaSheet: el('iSheet').value, deskripsi: el('iDesk').value, status: el('iStatus').value,
      };
    }

    function bukaTutupDialog() {
      simpanDraftDariLayar();
      var box = el('dialogIntegrasi');
      if (!box) return;
      var buka = !!(STATE.integrasiEdit || STATE.integrasiDraft);
      if (buka) box.innerHTML = integrasiFormHtml();
      else box.innerHTML = '';
      box.classList.toggle('open', buka);
      el('dialogScrim').classList.toggle('open', buka);
    }

    function pasangIntegrasi() {
      function muatKonfigLagi() {
        return run('getKonfigurasi').then(function (k) { STATE.konfigurasi = k; renderIntegrasi(); });
      }
      function galatForm(isi, hijau) {
        var box = el('iGalat');
        if (!box) return false;
        box.style.display = isi ? 'block' : 'none';
        box.style.background = hijau ? '#ecfdf5' : '#fef2f2';
        box.style.border = '1px solid ' + (hijau ? '#a7f3d0' : '#fecaca');
        box.style.color = hijau ? '#047857' : '#b91c1c';
        box.textContent = isi;
        if (isi) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return true;
      }
      function nilaiForm() {
        return {
          id: STATE.integrasiEdit || '',
          nama: el('iNama').value, brand: el('iBrand').value, program: el('iProgram').value,
          urlForm: el('iForm').value, urlEdit: el('iEdit').value, urlSpreadsheet: el('iSs').value,
          namaSheet: el('iSheet').value, deskripsi: el('iDesk').value, status: el('iStatus').value,
        };
      }
      el('btnIntegrasiBaru').addEventListener('click', function () {
        STATE.integrasiEdit = null;
        STATE.integrasiSheets = null;
        STATE.integrasiSsId = '';
        STATE.integrasiSheetForm = '';
        STATE.integrasiDraft = { nama: '', brand: '', program: '', urlForm: '', urlEdit: '', urlSpreadsheet: '', namaSheet: '', deskripsi: '', status: 'Aktif' };
        STATE.integrasiDraftKunci = true;
        renderIntegrasi();
        el('iNama').focus();
      });
      // Isian konfigurasi sekarang hidup di dalam popup, jadi elemennya hanya ada saat popup terbuka.
      var formTerbuka = !!el('iSimpan');
      if (formTerbuka) el('iBatal').addEventListener('click', function () {
        STATE.integrasiEdit = null;
        STATE.integrasiDraft = null;
        STATE.integrasiSheets = null;
        STATE.integrasiSsId = '';
        STATE.integrasiSheetForm = '';
        renderIntegrasi();
      });
      function isiDaftarSheet() {
        var urlSs = el('iSs').value.trim();
        var urlForm = el('iForm').value.trim();
        if (!urlSs && !urlForm) { el('statusIntegrasi').textContent = 'Isi link form atau link spreadsheet dulu.'; return; }
        el('statusIntegrasi').textContent = 'Membaca spreadsheet itu...';
        run('daftarSheetIntegrasi', [urlSs || urlForm]).then(function (h) {
          STATE.integrasiSheets = h.sheets || [];
          STATE.integrasiSsId = h.spreadsheetId || '';
          STATE.integrasiSheetForm = h.saranSheet || '';
          if (!STATE.integrasiDraft) STATE.integrasiDraft = {};
          if (h.saranSheet && !el('iSheet').value) {
            STATE.integrasiDraft.namaSheet = h.saranSheet;
            if (!urlSs) {
              el('iSs').value = 'https://docs.google.com/spreadsheets/d/' + h.spreadsheetId + '/edit';
              STATE.integrasiDraft.urlSpreadsheet = el('iSs').value;
            }
          }
          refreshIsianSheet();
        }).catch(function (e) { el('statusIntegrasi').textContent = ''; pesan(e, true); });
      }
      if (formTerbuka) el('iCariSheet').addEventListener('click', isiDaftarSheet);
      function kirimSimpan(data, mengedit) {
        var tombol = el('iSimpan');
        if (STATE.sedangSimpan) return Promise.resolve(null);
        STATE.sedangSimpan = true;
        tombol.disabled = true;
        tombol.textContent = 'Menyimpan & menguji koneksi...';
        var lepas = function () {
          STATE.sedangSimpan = false;
          if (el('iSimpan')) { el('iSimpan').disabled = false; el('iSimpan').textContent = 'Simpan & Hubungkan'; }
        };
        return run(mengedit ? 'ubahIntegrasi' : 'tambahIntegrasi', mengedit ? [STATE.integrasiEdit, data] : [data]).then(function (h) {
          lepas();
          STATE.integrasiEdit = null;
          STATE.integrasiDraft = null;
          STATE.integrasiSheets = null;
          STATE.integrasiSsId = '';
          STATE.integrasiSheetForm = '';
          bukaTutupDialog();
          if (h.error) pesan('Tersimpan tapi BELUM terhubung: ' + h.error, true);
          else pesan('Tersambung ke ' + h.uji.spreadsheetNama + ' / ' + h.uji.sheetNama + ' — ' + h.uji.baris + ' baris, ' +
            h.uji.dikenali.length + ' kolom utama dikenali.' +
            (h.brand ? (h.brandBaru ? ' Brand "' + h.brand + '" baru saja ditambahkan ke sidebar.' : ' Brand "' + h.brand + '" sudah menunjuk ke tab ini.') : '') +
            (h.peringatanPindah ? ' ' + h.peringatanPindah : '') + (h.peringatanTab ? ' CATATAN: ' + h.peringatanTab : ''));
          if (h.brand) { lupaRows(); return init(); }
          return muatKonfigLagi();
        }).catch(function (e) {
          lepas();
          var msg = String(e);
          if (msg.indexOf('Pindahkan jawaban form') !== -1) {
            mintaKonfirmasi('Tab ini sudah dipakai konfigurasi lain', msg, 'Pindahkan jawaban form', function () {
              data.pindah = true;
              kirimSimpan(data, mengedit).catch(function () { /* sudah ditampilkan */ });
            });
          } else if (msg.indexOf('Tetap buat') !== -1) {
            mintaKonfirmasi('Tab ini sudah dipakai konfigurasi lain', msg, 'Tetap buat', function () {
              data.paksa = true;
              kirimSimpan(data, mengedit).catch(function () { /* sudah ditampilkan */ });
            });
          }
          if (!galatForm(msg)) pesan(msg, true);
        });
      }
      if (formTerbuka) {
        el('iSimpan').addEventListener('click', function () { galatForm(''); kirimSimpan(nilaiForm(), !!STATE.integrasiEdit); });
        el('iNama').addEventListener('input', function () { galatForm(''); });
      }
      el('btnSinkronSemua').addEventListener('click', function () {
        el('statusIntegrasi').textContent = 'Sinkronisasi semua sumber...';
        run('sinkronSemuaIntegrasi').then(function (h) {
          el('statusIntegrasi').textContent = h.berhasil.length + ' sumber masuk' + (h.gagal.length ? ', ' + h.gagal.length + ' gagal' : '') + (h.dilewati ? ', ' + h.dilewati + ' nonaktif' : '');
          if (h.gagal.length) pesan(h.gagal.join(' | '), true);
          lupaRows();
          return init();
        }).catch(function (e) { el('statusIntegrasi').textContent = ''; pesan(e, true); });
      });
      el('btnDuplikat').addEventListener('click', function () {
        pesan('Memeriksa konfigurasi kembar...');
        run('bersihkanDuplikatIntegrasi', [false]).then(function (h) {
          if (!h.jumlah) { pesan('Tidak ada konfigurasi kembar — ' + (STATE.integrasi || []).length + ' kartu semuanya beda.'); return; }
          var dibuang = [];
          var dipertahankan = [];
          (h.rencana || []).forEach(function (g) {
            dipertahankan.push(g.dipertahankan.nama || g.dipertahankan.id);
            g.dibuang.forEach(function (d) { dibuang.push((d.nama || d.id) + ' (' + d.brand + ')'); });
          });
          mintaKonfirmasi(h.jumlah + ' konfigurasi kembar akan dibuang',
            'Yang dipertahankan: ' + dipertahankan.join(', ') + '. Yang dibuang: ' + dibuang.join(', ') + '. Ini hanya menghapus baris di tab Integrasi — data pendaftar di spreadsheet tidak disentuh, dan brand yang masih punya konfigurasi lain tetap muncul di sidebar.',
            'Ya, buang ' + h.jumlah, function () {
              run('bersihkanDuplikatIntegrasi', [true]).then(function (r) {
                pesan(r.dibuang.length + ' konfigurasi kembar dibuang' + (r.gagal.length ? ' — gagal: ' + r.gagal.join(' | ') : ''), !!r.gagal.length);
                lupaRows();
                return init();
              }).catch(function (e) { pesan(e, true); });
            });
        }).catch(function (e) { pesan(e, true); });
      });
      el('btnBersihContoh').addEventListener('click', function () {
        pesan('Memeriksa brand contoh...');
        run('bersihkanContoh', [false]).then(function (h) {
          if (!h.jumlah) { pesan('Tidak ada brand contoh yang terdaftar — yang ada hanya brand asli.'); return; }
          var daftar = (h.rencana || []).map(function (r) {
            return r.brand + ' (tab ' + (r.tab || '-') + (r.punyaForm ? ' + form CONTOH' : '') + (r.kartu.length ? ' + ' + r.kartu.length + ' kartu' : '') + ')';
          }).join(', ');
          mintaKonfirmasi(h.jumlah + ' brand contoh akan dibersihkan',
            'Yang dibuang: ' + daftar + '. Isinya hanya baris contoh (email @sample.invalid): tab jawabannya, form CONTOH masuk Trash Drive (30 hari masih bisa dipulihkan), kartunya di Integrasi, dan nama brandnya dari sidebar. Pendaftar asli tidak disentuh, dan brand contoh yang di tab-nya masih ada jawaban asli justru ditolak hapus.',
            'Ya, bersihkan', function () {
              run('bersihkanContoh', [true]).then(function (r) {
                var pesan2 = r.dibersihkan.length + ' brand contoh dibersihkan';
                if (r.gagal.length) pesan2 += ' — ditolak: ' + r.gagal.join(' | ');
                var ingat = r.dibersihkan.filter(function (d) { return d.peringatan; }).map(function (d) { return d.brand + ': ' + d.peringatan; });
                if (ingat.length) pesan2 += ' · ' + ingat.join(' | ');
                pesan(pesan2, !!r.gagal.length);
                lupaRows();
                return init();
              }).catch(function (e) { pesan(e, true); });
            });
        }).catch(function (e) { pesan(e, true); });
      });
      el('btnAmbilTab').addEventListener('click', function () {
        var tombol = el('btnAmbilTab');
        tombol.disabled = true;
        el('statusAmbilTab').textContent = 'Membaca semua tab di spreadsheet...';
        run('ambilSemuaTab', [{ urlSpreadsheet: el('iAutoSs').value.trim() }]).then(function (h) {
          STATE.ambilTab = h;

      function tampilSisa(h) {
        var tab = h.tab || [];

        el('statusSisa').textContent = tab.length + ' tab tertinggal, ' + form.length + ' form tidak terpakai.';
        var bagian = ['<div class="hint" style="margin-top:8px"><strong>Urutannya:</strong> buang <em>form</em> yang tidak terpakai dulu, baru <em>tab</em>-nya. Google tidak mengizinkan tab jawaban dihapus selama form-nya masih menautkan diri ke situ.</div>'];
        if (form.length) {
          bagian.push('<div class="sub" style="margin-top:8px">' + form.map(function (f) { return esc(f.nama); }).join('<br>') + '</div>' +
            '<div><button class="btn" type="button" id="btnBuangForm" style="margin-top:8px">Buang ' + form.length + ' form ke Trash</button></div>');
        }
        if (h.catatan) bagian.push('<div class="hint" style="color:#b91c1c">' + esc(h.catatan) + '</div>');
        if (tab.length) {
          bagian.push('<div class="sub" style="margin-top:8px">' + tab.map(function (t) {
            return esc(t.nama) + ' — ' + t.baris + ' baris' + (t.baris ? ' (isinya masih ada, tidak jadi dihapus)' : ' (kosong)');
          }).join('<br>') + '</div>' + (kosong.length
            ? '<div><button class="btn kecil" type="button" id="btnBuangTab" style="margin-top:8px">Buang ' + kosong.length + ' tab kosong</button></div>' : ''));
        }
        if (!bagian.length) bagian.push('<div class="kosong" style="margin-top:8px">Tidak ada sisa. Bersih.</div>');
        el('isiSisa').innerHTML = bagian.join('');

        if (el('btnBuangTab')) el('btnBuangTab').addEventListener('click', function () {
          mintaKonfirmasi('Buang tab kosong?', 'Hanya tab yang 0 baris yang jadi dihapus. Tab yang masih ada isinya ditolak otomatis.', 'Ya, buang', function () {
            run('buangTabSisa', [tab]).then(function (r) {

            }).catch(function (e) { pesan(e, true); });
          });
        });
        if (el('btnBuangForm')) el('btnBuangForm').addEventListener('click', function () {
          mintaKonfirmasi('Buang form ke Trash?', form.length + ' form tidak terpakai masuk Trash Drive. Masih bisa dipulihkan 30 hari.', 'Ya, buang', function () {
            run('bersihkanFileProyek', [form.map(function (f) { return f.id; })]).then(function (r) {
              pesan((r.diTrash || []).length + ' form dibuang' + ((r.ditolak || []).length ? ', ' + r.ditolak.length + ' ditolak' : ''));
              return run('daftarSisa').then(tampilSisa);
            }).catch(function (e) { pesan(e, true); });
          });
        });
      }

      el('btnCekSisa').addEventListener('click', function () {
        el('statusSisa').textContent = 'Menghitung sisa...';

      });
    }

      var merek = brand || STATE.brand;
      var punya = STATE.rowsByBrand[merek];
      var baris = punya ? (punya.rows || []).filter(function (r) { return r.row === rowNum; })[0] : null;
      if (baris) {
        STATE.detail = detailSementara(baris);
        renderPanel();
      }
      return run('getDetail', [merek, rowNum]).then(function (d) {
        STATE.detail = d;
        renderPanel();
        if (sedangDaftar()) renderTabelDaftar();
      }).catch(function (e) { pesan(e, true); });
    }

    function barisKv(label, nilai) {
      var v = /^https?:\/\//i.test(nilai)
        ? '<a href="' + esc(nilai) + '" target="_blank" rel="noopener">' + linkTeks(nilai) + '</a>'
        : esc(nilai);
      return '<dt>' + esc(String(label || '').replace(/\?+$/, '')) + '</dt><dd>' + v + '</dd>';
    }

    function linkTeks(u) {
      if (u.indexOf('drive.google') !== -1) return 'Buka file di Drive';
      if (u.indexOf('meet.google') !== -1) return 'Masuk ruang wawancara';
      if (u.indexOf('youtube') !== -1) return 'Buka video di YouTube';
      if (u.indexOf('script.google') !== -1) return 'Buka dashboard brand ini';
      return 'Buka link';
    }

    function renderPanel() {
      var d = STATE.detail;
      if (!d) return;
      var berkas = d.berkas.total
        ? '<div class="sub" style="margin-bottom:8px">' + d.berkas.ada + ' dari ' + d.berkas.total + ' berkas dikumpulkan' +
          (d.dokumenDiperiksa ? ' &middot; ' + esc(d.dokumenDiperiksa) : ' &middot; belum diperiksa') + '</div>'
        : '';
      var panel = el('panel');
      panel.innerHTML =
        '<div class="panel-head"><div><h3>' + esc(d.nama) + '</h3><div class="sub">' + esc(d.brand) + ' &middot; ' + esc(d.timestamp) + '</div></div>' +
        '<button class="close" type="button" aria-label="Tutup">&times;</button></div>' +
        '<div class="panel-body">' +
          '<dl class="kv">' + barisKv('Email', d.email) +
            d.jawaban.map(function (j) { return barisKv(j.label, j.nilai); }).join('') + '</dl>' +
          '<details class="ringkas" style="margin-bottom:6px"><summary>Jawaban lain (' + d.jawabanLain.length + ')</summary>' +
            '<dl class="kv">' + d.jawabanLain.map(function (j) { return barisKv(j.label, j.nilai); }).join('') + '</dl></details>' +

          '<div class="section"><h4>Status seleksi</h4><div class="status-row">' +
            d.statusList.map(function (s) {
              return '<button type="button" class="' + (s === d.status ? 'btn' : 'btn subtle') + '" data-status="' + esc(s) + '">' + esc(s) + '</button>';
            }).join('') + '</div>' +
            '<ul class="riwayat" style="margin-top:12px">' + (d.riwayat.length ? d.riwayat.map(function (r) {
              var bagian = String(r).split(' - ');
              return '<li><div class="w">' + esc(bagian[0]) + '</div>' + esc(bagian.slice(1).join(' - ')) + '</li>';
            }).join('') : '<li><div class="w">' + (d.sementara ? 'Memuat riwayat...' : 'Belum ada perubahan status.') + '</div></li>') + '</ul></div>' +

          bagianMagang(d) +

          bagianJadwal(d) +

          '<div class="section"><h4>Berkas pendaftaran</h4>' + berkas +
            (d.berkasList.length ? '<ul class="riwayat">' + d.berkasList.map(function (b) {
              return '<li>' + esc(potong(b.label, 40)) + '<div class="w"><a href="' + esc(b.url) + '" target="_blank" rel="noopener">' + linkTeks(b.url) + '</a></div></li>';
            }).join('') + '</ul>' : '<div class="sub">Tidak ada tautan berkas pada baris ini.</div>') +
            '<div style="margin-top:10px"><button class="btn subtle" type="button" id="cekDokumen">' +
            (d.dokumenDiperiksa === 'Sudah diperiksa' ? 'Tandai belum diperiksa' : 'Tandai dokumen diperiksa') + '</button></div></div>' +

          '<div class="section"><h4>Follow-up</h4>' +
            '<div class="sub" style="margin-bottom:8px">' + (d.email
              ? (d.emailTerakhir ? 'Email terakhir: ' + esc(d.emailTerakhir) : 'Belum pernah dikirimi email &middot; ' + esc(d.email))
              : 'Peserta ini tidak punya email di data form') + '</div>' +
            '<textarea id="catatan" placeholder="Contoh: sudah WA soal jadwal seleksi tahap 1"></textarea>' +
            (d.email ? '<label class="sub" style="display:block;margin-top:8px"><input type="checkbox" id="kirimEmail" style="margin-right:6px">Kirim catatan ini juga sebagai email ke ' + esc(d.email) + '</label>' : '') +
            '<button class="btn" type="button" id="simpanFollowup" style="margin-top:8px">Simpan follow-up</button>' +
            (d.history.length ? '<ul class="riwayat" style="margin-top:14px">' + d.history.map(function (h) {
              return '<li><div class="w">' + esc(h.waktu) + '</div>' + esc(h.catatan) + '</li>';
            }).join('') + '</ul>' : '<div class="sub" style="margin-top:10px">Belum ada catatan follow-up.</div>') + '</div>' +

          '<div class="section"><h4>Sertifikat</h4>' +
            '<button class="btn' + (d.linkSertifikat ? ' subtle' : '') + '" type="button" id="kirimSertifikat"' + (d.linkSertifikat || d.status !== 'Lulus' ? ' disabled' : '') + '>' +
            (d.linkSertifikat ? 'Sertifikat sudah dikirim' : 'Kirim sertifikat lewat email') + '</button>' +
            (d.linkSertifikat
              ? '<a class="sub" style="display:block;margin-top:8px" href="' + esc(d.linkSertifikat) + '" target="_blank" rel="noopener">Lihat berkas sertifikat</a>'
              : '<div class="sub" style="margin-top:8px">' + (d.status === 'Lulus' ? 'PDF dibuat dan email terkirim ke pendaftar.' : 'Bisa dikirim setelah statusnya Lulus (sekarang: ' + esc(d.status) + ').') + '</div>') + '</div>' +
        '</div>';

      panel.querySelector('.close').addEventListener('click', tutupPanel);
      Array.prototype.forEach.call(panel.querySelectorAll('[data-status]'), function (b) {
        b.addEventListener('click', function () { gantiStatus(b.getAttribute('data-status')); });
      });
      var simpanJadwalBtn = panel.querySelector('#jSimpan');
      if (simpanJadwalBtn) simpanJadwalBtn.addEventListener('click', simpanJadwal);
      var ubahJadwal = panel.querySelector('#jUbah');
      if (ubahJadwal) ubahJadwal.addEventListener('click', function () {
        ubahJadwal.style.display = 'none';
        panel.querySelector('#jForm').style.display = 'grid';
        panel.querySelector('#jTgl').focus();
      });
      panel.querySelector('#cekDokumen').addEventListener('click', ubahDokumen);
      panel.querySelector('#simpanFollowup').addEventListener('click', simpanFollowUp);
      var kirim = panel.querySelector('#kirimSertifikat');
      if (!kirim.disabled) kirim.addEventListener('click', kirimSertifikat);
      panel.classList.add('open');
      el('scrim').classList.add('open');
    }

    function tutupPanel() {
      STATE.detail = null;
      el('panel').classList.remove('open');
      el('panel').innerHTML = '';
      el('scrim').classList.remove('open');
      el('modal').classList.remove('open');
      if (sedangDaftar()) renderTabelDaftar();
      if (sedangSeleksi()) tampilSeleksi();
    }

    function mintaKonfirmasi(judul, pesanText, labelYa, ya, batal) {
      el('modalJudul').textContent = judul;
      el('modalPesan').textContent = pesanText;
      el('modalYa').textContent = labelYa;
      el('modal').classList.add('open');
      el('scrim').classList.add('open');
      // Klik beruntun waktu halamannya lemot pernah membuat satu aksi jalan berkali-kali,
      // jadi tombol "Ya" ini cuma boleh menghasilkan satu aksi per konfirmasi.
      var sudahDipakai = false;
      el('modalYa').onclick = function () {
        if (sudahDipakai) return;
        sudahDipakai = true;
        el('modal').classList.remove('open');
        if (!STATE.detail) el('scrim').classList.remove('open');
        ya();
      };
      el('modalBatal').onclick = function () {
        el('modal').classList.remove('open');
        if (!STATE.detail) el('scrim').classList.remove('open');
        if (batal) batal(el('modalBatal'));
      };
    }

    function mulai() {
      if (STATE.busy) return false;
      STATE.busy = true;
      Array.prototype.forEach.call(el('panel').querySelectorAll('button'), function (b) { b.disabled = true; });
      return true;
    }

    function selesai() {
      STATE.busy = false;
      var terkirim = !!(STATE.detail && STATE.detail.linkSertifikat);
      var bolehKirim = STATE.detail && (STATE.detail.status === 'Lulus' || terkirim);
      Array.prototype.forEach.call(el('panel').querySelectorAll('button'), function (b) {
        if (b.id === 'kirimSertifikat') { b.disabled = !bolehKirim; return; }
        b.disabled = false;
      });
    }

    function gantiStatus(status) {
      var d = STATE.detail;
      if (d.status === status) return;
      var lanjut = function () {
        if (!mulai()) return;
        var rowNum = d.row;
        var lama = d.status;
        // Status langsung berubah di layar, server menyusul di belakang.
        d.status = status;
        Array.prototype.forEach.call(el('panel').querySelectorAll('[data-status]'), function (b) {
          b.className = b.getAttribute('data-status') === status ? 'btn' : 'btn subtle';
        });
        var diDaftar = STATE.rows.filter(function (r) { return r.row === rowNum; })[0];
        if (diDaftar) diDaftar.status = status;
        run('updateStatus', [merekDetail(), rowNum, status]).then(function (res) {
          // Panel bisa ditutup sebelum server selesai, jadi jangan paksa STATE.detail ada di sini.
          selesai();
          if (STATE.detail && STATE.detail.row === rowNum) {
            STATE.detail.status = status;
            STATE.detail.riwayat = (STATE.detail.riwayat || []).concat([res.waktu + ' - Status: ' + lama + ' -> ' + status]);
            renderPanel();
          }
          pesan('Status diubah menjadi ' + status);
          segarkan(merekDetail()).catch(function () {});
          return null;
        }).catch(function (e) {
          d.status = lama;
          if (diDaftar) diDaftar.status = lama;
          selesai();
          pesan(e, true);
        });
      };
      if (status === 'Ditolak' || status === 'Dikeluarkan') {
        mintaKonfirmasi('Tandai ' + status.toLowerCase() + '?', 'Status ' + d.nama + ' akan menjadi ' + status + ' dan tercatat di riwayat.', 'Ya, tandai', lanjut);
      } else lanjut();
    }

    function simpanJadwal() {
      var d = STATE.detail;
      var tgl = el('jTgl').value, jam = el('jJam').value;
      if (!tgl) { pesan('Tanggal wawancara belum dipilih', true); return; }
      if (!mulai()) return;
      run('setJadwalWawancara', [merekDetail(), d.row, tgl, jam, el('jLokasi').value, el('jCatatan').value])
        .then(function (res) {
          selesai();
          d.jadwal = res.jadwal;
          renderPanel();
          pesan('Jadwal tersimpan: ' + res.jadwal);
          segarkan(merekDetail()).catch(function () {});
        }).catch(function (e) { selesai(); pesan(e, true); });
    }

    function ubahDokumen() {
      var d = STATE.detail;
      var nilai = d.dokumenDiperiksa === 'Sudah diperiksa' ? '' : 'Sudah diperiksa';
      if (!mulai()) return;
      run('periksaDokumen', [merekDetail(), d.row, nilai]).then(function (res) {
        selesai();
        d.dokumenDiperiksa = res.nilai === 'Belum periksa' ? '' : res.nilai;
        renderPanel();
        pesan('Dokumen: ' + res.nilai);
        segarkan(merekDetail()).catch(function () {});
      }).catch(function (e) { selesai(); pesan(e, true); });
    }

    function simpanFollowUp() {
      var d = STATE.detail;
      var catatan = el('catatan').value.trim();
      if (!catatan) { pesan('Catatan follow-up belum diisi', true); return; }
      var ikutEmail = !!(document.getElementById('kirimEmail') || {}).checked;
      if (!mulai()) return;
      run('tambahFollowUp', [merekDetail(), d.row, catatan, ikutEmail]).then(function (res) {
        selesai();
        d.history = (d.history || []).concat([{ waktu: res.waktu, catatan: catatan }]);
        el('catatan').value = '';
        var kotakEmail = document.getElementById('kirimEmail');
        if (kotakEmail) kotakEmail.checked = false;
        renderPanel();
        pesan(res.terkirim ? 'Follow-up disimpan dan email terkirim ke ' + res.terkirim : 'Follow-up disimpan');
        segarkan(merekDetail()).catch(function () {});
      }).catch(function (e) { selesai(); pesan(e, true); });
    }

    function kirimSertifikat() {
      var d = STATE.detail;
      if (!mulai()) return;
      pesan('Membuat dan mengirim sertifikat...');
      run('kirimSertifikat', [merekDetail(), d.row]).then(function (res) {
        selesai();
        pesan('Sertifikat terkirim ke ' + res.email);
        d.linkSertifikat = res.link;
        renderPanel();
        return Promise.all([segarkan(merekDetail()), muatLaporan()]);
      }).catch(function (e) { selesai(); pesan(e, true); });
    }

    function kirimSertifikatBaris(rowNum, merek) {
      pesan('Membuat dan mengirim sertifikat...');
      run('kirimSertifikat', [merek || STATE.brand, rowNum]).then(function (res) {
        pesan('Sertifikat terkirim ke ' + res.email);
        return Promise.all([segarkan(merek || STATE.brand), muatLaporan()]);
      }).catch(function (e) { pesan(e, true); });
    }

    // ---------- lain-lain ----------
    function galatHalaman(e) {
      el('halaman').innerHTML = '<div class="setup"><h3 style="margin-top:0">Data belum bisa dimuat</h3><p>' + esc(String(e)) + '</p></div>';
    }

    el('btnMuat').addEventListener('click', function () {
      var tombol = el('btnMuat');
      tombol.disabled = true;
      tombol.textContent = 'Memuat...';
      lupaRows();
      STATE.rowsByBrand = {};
      STATE.dashboardByBrand = {};
      STATE.laporanCache = null;
      STATE.prefetch = null;
      STATE.konfigurasi = null;
      STATE.halaman = 1;
      var selesai = function (e) {
        tombol.disabled = false;
        tombol.textContent = 'Muat ulang';
        if (e) pesan(String(e), true);
      };
      Promise.resolve(segarkan(STATE.brand))
        .then(function () { return init(); })
        .then(function () {
          var total = (STATE.overview || []).reduce(function (a, o) { return a + (o.total || 0); }, 0);
          selesai();
          pesan('Dimuat ulang: ' + total + ' pendaftar, ' + (STATE.overview || []).length + ' brand');
        })
        .catch(selesai);
    });

    el('btnKeluar').addEventListener('click', function () {
      var keluar = function () {
        STATE.loginTerbuka = false;
        var tokenLama = STATE.token;
        STATE.token = '';
        try { sessionStorage.removeItem('internadmin.login'); sessionStorage.removeItem('internadmin.token'); } catch (e) { /* abaikan */ }
        run('keluar', [tokenLama]).catch(function () { /* sesi server dilepas, tidak perlu lapor error */ });
        renderHalaman();
        pesan('Keluar. Masukkan username dan kata kunci lagi untuk masuk.');
      };
      var keKartuLogin = function () {
        STATE.page = 'pengaturan';
        renderSidebar();
        renderHalaman();
        var cari = function (percobaan) {
          var kotak = document.getElementById('lgUser');
          if (!kotak) { if (percobaan < 12) setTimeout(function () { cari(percobaan + 1); }, 250); return; }
          kotak.scrollIntoView({ behavior: 'smooth', block: 'center' });
          kotak.focus();
          // Layar Pengaturan digambar ulang begitu datanya datang, jadi fokusnya diulang sekali lagi.
          setTimeout(function () {
            var lagi = document.getElementById('lgUser');
            if (lagi) { lagi.scrollIntoView({ behavior: 'smooth', block: 'center' }); lagi.focus(); }
          }, 900);
          pesan('Belum ada login di aplikasi ini. Isi username + kata kunci di sini, lalu tekan "Pasang login".');
        };
        cari(0);
      };
      // Flag dari muat pertama bisa tertinggal (misalnya login baru saja dipasang di tab ini),
      // jadi kalau flag bilang "belum ada", ditanyakan dulu ke server sebelum menyimpulkan.
      if (STATE.bootstrap && STATE.bootstrap.butuhLogin) { keluar(); return; }
      run('getKonfigurasi').then(function (k) {
        if (k && k.loginAktif) { if (STATE.bootstrap) STATE.bootstrap.butuhLogin = true; keluar(); }
        else keKartuLogin();
      }).catch(keKartuLogin);
    });

    el('btnEkspor').addEventListener('click', function () {
      pesan('Membuat berkas CSV...');
      var nomor = saringCepat_(STATE.filter).filter(function (r) { return r.brand === STATE.brand; }).map(function (r) { return r.row; });
      run('eksporCsv', [STATE.brand, STATE.filter.dari, STATE.filter.sampai, nomor]).then(function (res) {
        mintaKonfirmasi('Berkas CSV siap', res.jumlahBaris + ' baris · ' + res.nama + ' tersimpan di folder Ekspor Dashboard Magang.', 'Buka berkas', function () {
          window.open(res.url, '_blank');
        });
      }).catch(function (e) { pesan(e, true); });
    });

    el('dialogScrim').addEventListener('click', function () {
      STATE.integrasiEdit = null;
      STATE.integrasiDraft = null;
      renderIntegrasi();
    });

    el('scrim').addEventListener('click', function () {
      if (el('modal').classList.contains('open')) {
        el('modal').classList.remove('open');
        if (!STATE.detail) el('scrim').classList.remove('open');
      } else tutupPanel();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (el('modal').classList.contains('open')) el('modalBatal').click();
        else if (STATE.detail) tutupPanel();
      }
    });

    // Kerangka ditampilkan dulu supaya tidak pernah kelihatan blank putih sambil menunggu server.
    function renderKerangka() {
      STATE.overview = [];
      renderSidebar();
      el('judulHalaman').textContent = HALAMAN[0].judul;
      el('subjudul').textContent = 'Menghubungkan ke spreadsheet data...';
      el('halaman').innerHTML =
        '<div class="card"><h3 style="margin-top:0">Memuat data pendaftar</h3>' +
        '<div class="hint">Sedang membaca spreadsheet tiap brand.</div>' +
        '<div class="hint" id="kerangkaTunggu" style="margin-top:10px"></div></div>';
    }

    if (localStorage.getItem('sampit') === '1') document.querySelector('.sidebar').classList.add('cil');
    el('btnSampit').addEventListener('click', function () {
      var sb = document.querySelector('.sidebar');
      sb.classList.toggle('cil');
      localStorage.setItem('sampit', sb.classList.contains('cil') ? '1' : '0');
    });

    renderKerangka();
    var tungguLama = setTimeout(function () {
      var k = el('kerangkaTunggu');
      if (k) k.textContent = 'Masih memuat. Buka pertama kali memang bisa 20-30 detik, setelah itu cepat.';
    }, 12000);
    init().then(function () { clearTimeout(tungguLama); });
  </script>
</body>
</html>
